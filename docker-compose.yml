services:
  # ----------------------------------------------------------------
  # 1. CONTENEDOR DE BASE DE DATOS (PostgreSQL)
  # ----------------------------------------------------------------
  db:
    image: postgres:13-alpine
    container_name: contenedor_db_formularios
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-formularios_db}
      POSTGRES_USER: ${DB_USER:-postgres_usuario}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres_clave_secreta}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./database/formularios_inicial.sql:/docker-entrypoint-initdb.d/01_formularios_inicial.sql:ro
      - ./database/diagnostico.sql:/docker-entrypoint-initdb.d/02_diagnostico.sql:ro
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - red_formularios

  # ----------------------------------------------------------------
  # 2. CONTENEDOR DE BACKEND (PHP 7.3 + Apache + PDO PostgreSQL)
  # ----------------------------------------------------------------
  back_form:
    build:
      context: ./back_form
      dockerfile: Dockerfile
    container_name: contenedor_back_form
    restart: unless-stopped
    ports:
      - "${BACK_PORT:-83}:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: ${DB_NAME:-formularios_db}
      DB_USER: ${DB_USER:-postgres_usuario}
      DB_PASS: ${DB_PASS:-postgres_clave_secreta}
    volumes:
      - ./back_form:/var/www/html
    depends_on:
      - db
    networks:
      - red_formularios

  # ----------------------------------------------------------------
  # 3. CONTENEDOR DE FRONTEND (PHP 7.3 + Apache + Bootstrap)
  # ----------------------------------------------------------------
  front_forms:
    build:
      context: ./front_forms
      dockerfile: Dockerfile
    container_name: contenedor_front_forms
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-82}:80"
    environment:
      URL_BACKEND: ${URL_BACKEND:-http://192.168.11.75:83}
    volumes:
      - ./front_forms:/var/www/html
    depends_on:
      - back_form
    networks:
      - red_formularios

volumes:
  datos_postgres:
    name: volumen_datos_postgres

networks:
  red_formularios:
    name: red_formularios
    driver: bridge