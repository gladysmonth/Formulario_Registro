<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico - COSMOL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="text-center mb-4">
        <h3 class="text-primary fw-bold">Registro de Soporte Técnico</h3>
        <p class="text-muted">Formulario FOR_SI_ST_001</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form id="formularioTicket">
                
                <h5 class="text-secondary border-bottom pb-2">1. Datos Generales</h5>
                <div class="mb-3">
                    <label class="form-label">Nombre del Solicitante</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Departamento / Área</label>
                    <select class="form-select" id="departamento">
                        <option value="">Seleccione su área...</option>
                        <option value="Sistemas">Sistemas</option>
                        <option value="Contabilidad">Contabilidad</option>
                        <option value="AtencionCliente">Atención al Cliente</option>
                        <option value="RecursosHumanos">Recursos Humanos</option>
                    </select>
                </div>

                <h5 class="text-secondary border-bottom pb-2 mt-4">2. Tipo de Soporte</h5>
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoSoporte" value="Hardware" id="radioHard" checked>
                        <label class="form-check-label" for="radioHard">Hardware (equipos, periféricos)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoSoporte" value="Software" id="radioSoft">
                        <label class="form-check-label" for="radioSoft">Software (aplicaciones, sistemas)</label>
                    </div>
                </div>

                <h5 class="text-secondary border-bottom pb-2 mt-4">3. Detalles del Problema</h5>
                <div class="mb-3">
                    <label class="form-label">Descripción detallada</label>
                    <textarea class="form-control" id="descripcion" rows="4" placeholder="Describa la falla aquí..." required></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">GUARDAR TICKET</button>
                </div>

            </form>
        </div>
    </div>
</div>
<script src="logica.js"></script>
</body>
</html>
